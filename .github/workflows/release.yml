name: Release

# Publishes a .vsix to GitHub Releases. Two ways in:
#   - push a tag `v<version>` matching package.json (the normal path)
#   - run this workflow manually from the Actions tab (re-uploads to the tag's release)
#
# Every release carries:
#   fm-bridge-<version>.vsix  this build, for the archive
#   fm-bridge-windows.vsix    this build, under the name README's Windows link uses
#   fm-bridge.vsix            this build (pre-split name; kept so old links still resolve)
#   fm-bridge-mac.vsix        COPIED FORWARD from the previous latest release, so macOS stays
#                             on the last build verified on a Mac (0.1.21 at the time of the
#                             split). To move macOS to this build, run the workflow manually
#                             with "update_mac" ticked.
# README links to releases/latest/download/fm-bridge-{mac,windows}.vsix, so a release never
# needs a README edit — but it MUST carry both files, or one of those links 404s.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and (re)upload, e.g. v0.1.21'
        required: true
      update_mac:
        description: 'Also publish this build as fm-bridge-mac.vsix (only once it is verified on macOS)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION — bump package.json or retag"
            exit 1
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Tags up to v0.1.24 were cut under MIT; their published builds were relicensed by hand
      # (2026-10-22). Rebuilding one here would publish an MIT build again, so refuse.
      - name: Check license
        run: |
          if grep -q "MIT License" LICENSE || grep -q '"license": *"MIT"' package.json; then
            echo "::error::this tag's source is still MIT-licensed — cut a new tag from main instead of rebuilding it"
            exit 1
          fi

      # Zero runtime dependencies, so there is nothing to install — but the round-trip
      # test is the gate that has caught every converter regression so far.
      - name: Test
        run: npm test

      - name: Package
        run: |
          npx --yes @vscode/vsce package
          cp "fm-bridge-${{ steps.v.outputs.version }}.vsix" fm-bridge.vsix
          cp "fm-bridge-${{ steps.v.outputs.version }}.vsix" fm-bridge-windows.vsix

      # Must run BEFORE publishing: once this tag's release exists it becomes "latest", and
      # the previous Mac build would no longer be the latest release's.
      - name: Mac build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.inputs.update_mac }}" = "true" ]; then
            cp "fm-bridge-${{ steps.v.outputs.version }}.vsix" fm-bridge-mac.vsix
            echo "macOS: publishing this build (${{ steps.v.outputs.version }})"
          elif gh release download --repo "$GITHUB_REPOSITORY" -p fm-bridge-mac.vsix; then
            MAC=$(unzip -p fm-bridge-mac.vsix extension/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
            echo "macOS: carrying forward $MAC from the previous latest release"
          else
            echo "::error::the latest release has no fm-bridge-mac.vsix to carry forward — re-run this workflow manually with update_mac ticked to publish this build for macOS"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "fm-bridge-${{ steps.v.outputs.version }}.vsix" fm-bridge.vsix \
              fm-bridge-windows.vsix fm-bridge-mac.vsix --clobber
          else
            gh release create "$TAG" \
              --title "FM Bridge ${{ steps.v.outputs.version }}" \
              --generate-notes \
              --latest \
              "fm-bridge-${{ steps.v.outputs.version }}.vsix" fm-bridge.vsix \
              fm-bridge-windows.vsix fm-bridge-mac.vsix
          fi
