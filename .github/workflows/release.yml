name: Release

# Publishes a .vsix to GitHub Releases. Two ways in:
#   - push a tag `v<version>` matching package.json (the normal path)
#   - run this workflow manually from the Actions tab (re-uploads to the tag's release)
#
# Every release carries the build twice: `fm-bridge-<version>.vsix` for the archive, and
# `fm-bridge.vsix` under a version-free name so this URL is always the newest build:
#   https://github.com/KiBiz-Systems/FMBridge/releases/latest/download/fm-bridge.vsix
# That link is what README points at — it never needs editing on a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and (re)upload, e.g. v0.1.21'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION — bump package.json or retag"
            exit 1
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Zero runtime dependencies, so there is nothing to install — but the round-trip
      # test is the gate that has caught every converter regression so far.
      - name: Test
        run: npm test

      - name: Package
        run: |
          npx --yes @vscode/vsce package
          cp "fm-bridge-${{ steps.v.outputs.version }}.vsix" fm-bridge.vsix

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "fm-bridge-${{ steps.v.outputs.version }}.vsix" fm-bridge.vsix --clobber
          else
            gh release create "$TAG" \
              --title "FM Bridge ${{ steps.v.outputs.version }}" \
              --generate-notes \
              --latest \
              "fm-bridge-${{ steps.v.outputs.version }}.vsix" fm-bridge.vsix
          fi
